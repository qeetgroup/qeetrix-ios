name: CI

# Pull requests are checked once, and main again after each merge; a push to develop is covered by its pull request.
# The iOS Simulator tests (the slow part) run on pull requests into main, on main and on request; everyday pull
# requests into develop run Build and test. The showcase's UI tests run in Xcode, not here (CONTRIBUTING.md).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: confirm the pinned upstream artifacts still match the lock.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Xcode this package is verified with, on GitHub's xcode-27 runner image (a public preview). If the image stops
  # carrying it, the select step fails loudly: update the pin and re-verify locally rather than letting it float.
  XCODE_VERSION: "27.1"

jobs:
  package:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the source-compatibility check below builds the target branch from this history
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      # The generator, the upstream lock and drift, swift-format, compiler warnings, dependencies and licences,
      # resources, and the library's tests on the Mac host (Scripts/check.sh).
      - name: Lint and tests
        run: Scripts/check.sh
      # A pull request may not break source compatibility with its target branch, unless VERSION raises the
      # major version (the minor while 0.x). SwiftPM checks the baseline out of a copy of the repository that
      # carries only local branches, so the target branch is fetched into one.
      - name: Source compatibility with the target branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF:pull-base-ref"
          Scripts/api-compat.sh pull-base-ref

  ios:
    name: iOS tests
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Pick a simulator
        id: simulator
        run: echo "id=$(Scripts/ci-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build for iOS devices
        run: xcodebuild build -scheme Qeetrix -destination 'generic/platform=iOS' -derivedDataPath .build/xcode
      - name: Library tests on the iOS Simulator
        run: |
          xcodebuild test -scheme Qeetrix -only-testing:QeetrixTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .build/xcode
      - name: DocC documentation (warnings are errors)
        run: Scripts/docs.sh

  upstream:
    name: Pinned upstream still matches the lock
    # Networked: weekly, on request, and on a pull request that changes Upstream/.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip unless Upstream/ changed (pull requests)
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- Upstream; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Select Xcode
        if: steps.changed.outputs.run != 'false'
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Fetch and compare
        if: steps.changed.outputs.run != 'false'
        run: Scripts/sync-upstream.sh --check
