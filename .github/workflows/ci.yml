name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly: confirm the pinned upstream artifacts still match the lock.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Xcode this package was verified with. If the runner image does not carry it, the select step
  # fails loudly; update this pin (and re-verify locally) rather than letting the toolchain float.
  XCODE_VERSION: "27.1"

jobs:
  package:
    name: Generator, drift, format, warnings, dependencies, resources, host tests, API
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, pinned by commit
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          swift --version
      - name: Generator tests
        run: swift test --package-path Tools/QeetrixGen
      - name: Snapshot matches its lock; generated files are current
        run: Scripts/verify.sh
      - name: swift-format (strict)
        run: Scripts/lint.sh
      - name: No compiler warnings (static analysis)
        run: Scripts/warnings.sh
      - name: Dependencies are reviewed, test-only and licensed as recorded
        run: Scripts/dependencies.sh
      - name: Built-in strings and snapshot baselines are consistent
        run: Scripts/resources.sh
      - name: Library tests on the macOS host
        run: swift test
      - name: Public API matches the committed baseline
        run: Scripts/api-check.sh
      # Swift's own checker: a pull request may not break source compatibility with its target branch,
      # except for breaks a decision record accepted (Documentation/API/breaking-changes-allowlist.txt).
      - name: Source compatibility with the target branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          Scripts/api-compat.sh "origin/${{ github.base_ref }}"

  ios:
    name: iOS build, unit tests, docs
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, pinned by commit
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Pick a simulator
        id: simulator
        run: echo "id=$(Scripts/ci-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build for iOS devices
        run: xcodebuild build -scheme Qeetrix -destination 'generic/platform=iOS' -derivedDataPath .build/xcode
      - name: Unit tests on the iOS Simulator
        run: |
          xcodebuild test -scheme Qeetrix -only-testing:QeetrixTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .build/xcode
      # Snapshot baselines are recorded locally and never committed (ADR 0009), so CI cannot compare
      # images; the step above builds the snapshot target, so it still compiles.
      - name: Build the DocC documentation (warnings are errors)
        run: Scripts/docs.sh

  showcase:
    name: Showcase build and UI tests
    runs-on: macos-26
    # The UI tests include the accessibility audit gate: 64 minutes locally (TEST_COVERAGE.md).
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, pinned by commit
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Pick a simulator
        id: simulator
        run: echo "id=$(Scripts/ci-simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build the showcase and its UI tests with warnings as errors
        run: |
          xcodebuild build-for-testing -project Examples/QeetrixShowcase/QeetrixShowcase.xcodeproj -scheme QeetrixShowcase \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .build/showcase SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: UI tests (interaction and accessibility semantics)
        run: |
          xcodebuild test -project Examples/QeetrixShowcase/QeetrixShowcase.xcodeproj -scheme QeetrixShowcase \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .build/showcase

  consumer:
    name: An independent app installs the package by version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, pinned by commit
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      # Commits and tags the checkout in a throwaway repository under $RUNNER_TEMP, never this one, then
      # resolves, tests and builds the consumer app against that tag.
      - name: Consumer check
        run: Scripts/consumer-check.sh 0.0.0-ci.1 "$RUNNER_TEMP/consumer"

  upstream:
    name: Pinned upstream still matches the lock
    # Networked, so it runs on a schedule, on demand, and when the pins or lock change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, pinned by commit
      - name: Skip unless Upstream/ changed (pull requests)
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- Upstream; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Select Xcode
        if: steps.changed.outputs.run != 'false'
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Fetch and compare
        if: steps.changed.outputs.run != 'false'
        run: Scripts/sync-upstream.sh --check
