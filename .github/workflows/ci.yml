name: CI

# Verify, once per change: on every pull request into develop (Dependabot's, a contributor's) and on the
# develop → main pull request, which is what main takes. Pushes run nothing, so no commit is checked twice.
#
# Verify is the quick gate on the Mac: generated files and the upstream lock, swift-format, a build of the library
# and its tests with no compiler warnings, and the dependencies and licences. The tests (Mac host and iOS
# Simulator), DocC, source compatibility and the showcase run locally before pushing (CONTRIBUTING.md, "Before you
# push").
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The Xcode this package is verified with, on GitHub's xcode-27 runner image (a public preview). If the image stops
  # carrying it, the select step fails loudly: update the pin and re-verify locally rather than letting it float.
  XCODE_VERSION: "27.1"

jobs:
  verify:
    name: Verify
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Generated files and the upstream lock
        run: Scripts/verify.sh
      - name: Formatting (swift-format, strict)
        run: Scripts/lint.sh
      - name: Build with no compiler warnings
        run: Scripts/warnings.sh
      - name: Dependencies and licences
        run: Scripts/dependencies.sh
