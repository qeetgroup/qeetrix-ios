name: CodeQL

# GitHub's code scanning of these workflows: finds security problems such as untrusted input in a run step. Results
# appear in the repository's Security tab. Runs on every pull request, on main after each merge, and weekly for new
# queries. The Swift code isn't scanned: CodeQL's Swift build tracer can't start a package build on the xcode-27
# runner image ("Bad CPU type in executable", with or without Rosetta), and the library has no network, storage or
# credential code for the Swift queries to look at.
on:
  # On develop only, as CI: every push to it and every pull request into it, so main isn't analysed again after a
  # merge. The weekly run analyses main, which keeps the Security tab's alerts for it current.
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:actions
