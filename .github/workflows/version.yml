name: Version

# A develop → main pull request that changes what ships must raise `VERSION`. Raise it on develop, in an ordinary
# commit, before opening the pull request: the next patch, or a minor or major by hand (a breaking API change before 1.0
# needs a minor, docs/releases.md). This check fails, naming the next patch, until it's raised. A version not yet
# released on main, or a pull request that changes nothing that ships (docs, tests, CI, the showcase), needs none. Nothing
# commits for you: main requires CI on the pull request's last commit, and a commit pushed by a workflow gets no CI run
# of its own.
#
# It never checks out the pull request's code: it reads files through the GitHub API.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  raised:
    name: Version is raised
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The version is raised when the pull request ships something
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          version_at() {
            gh api "repos/$repo/contents/VERSION?ref=$1" --jq .content 2>/dev/null | base64 -d | tr -d '[:space:]'
          }
          tag_exists() { gh api "repos/$repo/git/ref/tags/$1" > /dev/null 2>&1; }

          current=$(version_at "$HEAD_SHA")
          base=$(version_at "$BASE" || true)
          echo "This pull request: $current. $BASE: ${base:-none}."
          if [ -z "$base" ] || [ "$current" != "$base" ]; then
            echo "The version is raised (or this is the first release)."; exit 0
          fi
          if ! tag_exists "$base"; then
            echo "$BASE's $base isn't released yet (no tag $base): this pull request releases it."; exit 0
          fi
          # Listed first, then searched: piped straight into grep -q, gh dies of SIGPIPE when grep stops at the first
          # match, and pipefail would turn that match into a miss on a long list.
          files=$(gh api "repos/$repo/pulls/$PR/files" --paginate --jq '.[].filename')
          if ! grep -q -E '^(Sources/|Package\.swift$|Upstream/)' <<< "$files"; then
            echo "This pull request changes nothing that ships: no new version, and nothing to publish."; exit 0
          fi
          # The next patch (or, after a release candidate, the next candidate) that has no tag yet.
          next="$base"
          while tag_exists "$next" || [ "$next" = "$base" ]; do
            if [[ "$next" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
              next="${BASH_REMATCH[1]}-rc.$((BASH_REMATCH[2] + 1))"
            else
              IFS=. read -r major minor patch <<< "$next"
              next="$major.$minor.$((patch + 1))"
            fi
          done
          echo "::error::This pull request changes what ships: raise VERSION above $base on develop, in an ordinary commit: $next for a patch, or a minor or major by hand."
          exit 1
